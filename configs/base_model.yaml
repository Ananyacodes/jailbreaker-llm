model:
  vocab_size: 32000
  n_layer: 12
  n_head: 12
  n_embd: 768
  block_size: 1024
  dropout: 0.1
  bias: false

pretrain:
  # Stronger compact instruction model. PPO trains LoRA adapters instead of
  # duplicating and fully updating all base-model weights.
  warm_start_from: "Qwen/Qwen2.5-0.5B-Instruct"
  # Keep one copy in the Hugging Face cache. Set true only if you explicitly
  # need a standalone duplicate under out_dir.
  copy_to_out_dir: false

  data_dir: "data/tokenized"
  out_dir: "checkpoints/qwen2.5-0.5b-base"
  device: "cuda"
  dtype: "bfloat16"

  batch_size: 32
  grad_accum_steps: 4
  max_iters: 60000
  warmup_iters: 1000
  learning_rate: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  compile: true
